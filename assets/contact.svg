<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <linearGradient id="contactDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="contactSubtleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#5c0000;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="contactSoftGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a8891f;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="80" fill="url(#contactDarkBg)"/>

  <!-- Section title -->
  <text x="60" y="30" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="300"
        fill="#c9a227" letter-spacing="2" opacity="0.7">
    連絡 // CONTACT
  </text>

  <!-- Vertical accent line -->
  <line x1="60" y1="40" x2="60" y2="70" stroke="url(#contactSubtleRed)" stroke-width="1" opacity="0.3"/>

  <!-- Contact info in minimal dark style -->
  <g transform="translate(100, 55)">
    <text x="0" y="0" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" opacity="0.8">
      📧 contact@example.com
    </text>
    <text x="180" y="0" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" opacity="0.8">
      ✈️ t.me/username
    </text>
    <text x="340" y="0" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" opacity="0.8">
      🐙 github.com/WebSeraf
    </text>
  </g>

  <!-- Small traditional seal -->
  <g transform="translate(720, 25)" opacity="0.4">
    <circle cx="0" cy="0" r="12" fill="#8b0000" opacity="0.15"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#5c0000" stroke-width="0.5"/>
    <text x="0" y="3" font-family="'Noto Sans JP', serif" font-size="7"
          fill="#8b0000" text-anchor="middle">
    連
    </text>
  </g>

  <!-- Subtle wave pattern at bottom -->
  <g transform="translate(100, 72)" opacity="0.1">
    <path d="M0,2 Q5,0 10,2 T20,2 T30,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
    <path d="M100,2 Q105,0 110,2 T120,2 T130,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
    <path d="M200,2 Q205,0 210,2 T220,2 T230,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
    <path d="M300,2 Q305,0 310,2 T320,2 T330,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
    <path d="M400,2 Q405,0 410,2 T420,2 T430,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
    <path d="M500,2 Q505,0 510,2 T520,2 T530,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
    <path d="M600,2 Q605,0 610,2 T620,2 T630,2" fill="none" stroke="#8b8b8b" stroke-width="0.5"/>
  </g>

  <!-- Corner accents -->
  <g opacity="0.2">
    <path d="M20,12 L24,12 L20,16 Z" fill="#8b0000"/>
    <path d="M780,68 L776,68 L780,64 Z" fill="#8b0000"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="77" width="800" height="2" fill="url(#contactSubtleRed)" opacity="0.15"/>
</svg>
