<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="skillsDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="skillsSubtleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#5c0000;stop-opacity:0.5" />
    </linearGradient>

    <linearGradient id="skillsSoftGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a8891f;stop-opacity:0.4" />
    </linearGradient>

    <pattern id="darkGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#2a2a2a" opacity="0.8"/>
    </pattern>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="160" fill="url(#skillsDarkBg)"/>

  <!-- Subtle grid -->
  <rect width="800" height="160" fill="url(#darkGrid)" opacity="0.4"/>

  <!-- Section title with traditional styling -->
  <text x="60" y="35" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="300"
        fill="#c9a227" letter-spacing="3" opacity="0.8">
    技術 // SKILLS
  </text>

  <!-- Vertical accent line -->
  <line x1="60" y1="50" x2="60" y2="145" stroke="url(#skillsSubtleRed)" stroke-width="1.5" opacity="0.4"/>

  <!-- Skills in minimal grid -->
  <g transform="translate(100, 65)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="100" height="28" rx="2" fill="none" stroke="#3a3a3a" stroke-width="0.5" opacity="0.8"/>
    <text x="50" y="19" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#a8a8a8" text-anchor="middle">JavaScript</text>

    <rect x="120" y="0" width="100" height="28" rx="2" fill="none" stroke="#3a3a3a" stroke-width="0.5" opacity="0.8"/>
    <text x="170" y="19" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#a8a8a8" text-anchor="middle">TypeScript</text>

    <rect x="240" y="0" width="100" height="28" rx="2" fill="none" stroke="#3a3a3a" stroke-width="0.5" opacity="0.8"/>
    <text x="290" y="19" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#a8a8a8" text-anchor="middle">React</text>

    <rect x="360" y="0" width="100" height="28" rx="2" fill="none" stroke="#3a3a3a" stroke-width="0.5" opacity="0.8"/>
    <text x="410" y="19" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#a8a8a8" text-anchor="middle">Node.js</text>

    <!-- Row 2 -->
    <rect x="0" y="40" width="100" height="28" rx="2" fill="none" stroke="#2a2a2a" stroke-width="0.5" opacity="0.6"/>
    <text x="50" y="59" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" text-anchor="middle">Git</text>

    <rect x="120" y="40" width="100" height="28" rx="2" fill="none" stroke="#2a2a2a" stroke-width="0.5" opacity="0.6"/>
    <text x="170" y="59" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" text-anchor="middle">Docker</text>

    <rect x="240" y="40" width="100" height="28" rx="2" fill="none" stroke="#2a2a2a" stroke-width="0.5" opacity="0.6"/>
    <text x="290" y="59" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" text-anchor="middle">Python</text>

    <rect x="360" y="40" width="100" height="28" rx="2" fill="none" stroke="#2a2a2a" stroke-width="0.5" opacity="0.6"/>
    <text x="410" y="59" font-family="'Noto Sans JP', sans-serif" font-size="10"
          fill="#8a8a8a" text-anchor="middle">Linux</text>
  </g>

  <!-- Traditional decorative element -->
  <g transform="translate(700, 80)" opacity="0.25">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#c9a227" stroke-width="1"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#8b0000" stroke-width="0.5"/>
    <text x="0" y="4" font-family="'Noto Sans JP', serif" font-size="9"
          fill="#8b0000" text-anchor="middle">
    技
    </text>
  </g>

  <!-- Subtle wave pattern -->
  <g transform="translate(100, 140)" opacity="0.15">
    <path d="M0,3 Q5,0 10,3 T20,3 T30,3 T40,3 T50,3" fill="none" stroke="#8b8b8b" stroke-width="0.6"/>
    <path d="M100,3 Q105,0 110,3 T120,3 T130,3 T140,3 T150,3" fill="none" stroke="#8b8b8b" stroke-width="0.6"/>
    <path d="M200,3 Q205,0 210,3 T220,3 T230,3 T240,3 T250,3" fill="none" stroke="#8b8b8b" stroke-width="0.6"/>
    <path d="M300,3 Q305,0 310,3 T320,3 T330,3 T340,3 T350,3" fill="none" stroke="#8b8b8b" stroke-width="0.6"/>
    <path d="M400,3 Q405,0 410,3 T420,3 T430,3 T440,3 T450,3" fill="none" stroke="#8b8b8b" stroke-width="0.6"/>
    <path d="M500,3 Q505,0 510,3 T520,3 T530,3 T540,3 T550,3" fill="none" stroke="#8b8b8b" stroke-width="0.6"/>
  </g>

  <!-- Corner accents -->
  <g opacity="0.2">
    <path d="M20,15 L25,15 L20,20 Z" fill="#8b0000"/>
    <path d="M780,145 L775,145 L780,140 Z" fill="#8b0000"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="155" width="800" height="3" fill="url(#skillsSubtleRed)" opacity="0.2"/>
</svg>
